---
name: Publish server image to GHCR
run-name: 'Publish image — ${{ github.ref_name }}'

# Same trigger as the CLI publish: a `v*` tag builds both. They share the version.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  packages: write # required to push to ghcr.io for this repo

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openroadie

jobs:
  publish:
    name: Build + push OpenRoadie server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GHCR login uses the built-in GITHUB_TOKEN — no secret to add.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels from the git ref: v0.1.0 -> :0.1.0 and :latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `latest=auto` only moves the `:latest` tag when a valid semver
          # version tag is produced, so a mistagged ref can't overwrite latest.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
