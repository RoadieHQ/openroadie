version: 2

updates:
  # Yarn workspaces: one entry covers the root plus packages/* and plugins/*.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Dublin
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Without grouping, a repo this size produces dozens of PRs a week and
      # nobody reads any of them.
      #
      # Dependabot assigns a dependency to the FIRST group it matches, so this
      # catch-all must stay at the top: every minor/patch bump lands in one PR,
      # and the named groups below only ever see majors (which stay grouped by
      # family, since e.g. storybook packages have to move in lockstep).
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      # Security updates ignore version-update groups unless told otherwise,
      # which is how a lone hono patch got its own PR.
      security-minor-and-patch:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-router*'
      radix:
        patterns:
          - '@radix-ui/*'
      tooling:
        patterns:
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'
          - 'typescript'
          - 'vite*'
          - 'vitest*'
          - '@vitejs/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      testing:
        patterns:
          - '@testing-library/*'
          - '@playwright/*'
          - 'playwright*'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
    ignore:
      # Pinned by `resolutions` in the root package.json. Bumping them here
      # produces a PR that does not change what actually gets installed.
      - dependency-name: 'luxon'
      - dependency-name: '@types/luxon'
      - dependency-name: 'knex'
      - dependency-name: 'graphql'
      - dependency-name: '@smithy/types'
      - dependency-name: '@smithy/middleware-endpoint'
      # React 18 is deliberate; a React 19 bump is a project, not a dependency update.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
      # ESLint 10 removed the legacy context methods (context.getFilename etc.)
      # that eslint-plugin-react 7.37 and eslint-plugin-jsx-a11y 6.10 still call;
      # lint crashes on load. Lift once both plugins declare ESLint 10 support.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Dublin
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Dublin
    labels:
      - dependencies
    commit-message:
      prefix: build
