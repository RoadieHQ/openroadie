name: Bug report
description: Something in openroadie does not work the way it should.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, what happened instead, and how to reproduce it. Include your version and how you run openroadie. Redact any tokens or secrets.
    validations:
      required: true
