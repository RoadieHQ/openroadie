name: Documentation issue
description: Something in the docs is wrong, missing, or confusing.
labels: ['documentation', 'needs triage']
body:
  - type: input
    id: location
    attributes:
      label: Where?
      description: A link, or a path such as `docs/getting-started.md`.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: If you followed a set of steps and got stuck, tell us where you got stuck — that is the most useful kind of docs report.
    validations:
      required: true
