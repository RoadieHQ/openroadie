# Self-hosted OpenRoadie: the server plus its Postgres, bootable with just
# `docker compose up`. The `openroadie` service pulls the published image whose
# tag is pinned by the CLI (`openroadie up` injects OPENROADIE_IMAGE_TAG = the
# CLI's own version so the running server matches the CLI that deployed it);
# defaults to `latest` when run by hand.
#
# To build the image locally instead of pulling (e.g. before it is published):
#   docker build -t ghcr.io/roadiehq/openroadie:latest .
#   OPENROADIE_IMAGE_TAG=latest docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - openroadie-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

  openroadie:
    image: ghcr.io/roadiehq/openroadie:${OPENROADIE_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '7008:7008'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:7008/readiness'').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  openroadie-db: {}
