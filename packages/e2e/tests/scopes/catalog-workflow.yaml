# Scope enforcement for the catalog-workflow REST API (no MCP surface).

api:
  # --- catalog-workflow:query ---
  - method: get
    url: /api/catalog-workflow/workflows
    scopes: ['catalog-workflow:query']
    expectations: { status: 200 }
  - method: get
    url: /api/catalog-workflow/workflows
    scopes: []
    expectations: { status: 403, bodyIncludes: ['insufficient scope'] }

  # --- catalog-workflow:get ---
  - method: get
    url: /api/catalog-workflow/workflows/00000000-0000-0000-0000-000000000000
