# Scope enforcement for the secrets-settings REST API (no MCP surface).

api:
  # --- secrets-settings:query ---
  - method: get
    url: /api/secrets-settings/keys
    scopes: ['secrets-settings:query']
    expectations: { status: 200 }
  - method: get
    url: /api/secrets-settings/keys
    scopes: []
    expectations: { status: 403, bodyIncludes: ['insufficient scope'] }

  # --- secrets-settings:get ---
  - method: get
    url: /api/secrets-settings/storage-mode
    scopes: ['secrets-settings:get']
    expectations: { status: 200 }
  - method: get
    url: /api/secrets-settings/storage-mode
    scopes: []
    expectations: { status: 403, bodyIncludes: ['insufficient scope'] }

  # --- secrets-settings:create ---
  - method: post
    url: /api/secrets-settings/secret-metadata
    body: {}
    scopes: ['secrets-settings:create']
    expectations: { status: { operator: '!=', value: 403 } }
  - method: post
    url: /api/secrets-settings/secret-metadata
    body: {}
    scopes: []
    expectations: { status: 403, bodyIncludes: ['insufficient scope'] }

  # --- secrets-settings:delete ---
  - method: delete
    url: /api/secrets-settings/secret-metadata/scopes-e2e-missing
    scopes: ['secrets-settings:delete']
    expectations: { status: { operator: '!=', value: 403 } }
  - method: delete
    url: /api/secrets-settings/secret-metadata/scopes-e2e-missing
    scopes: []
    expectations: { status: 403, bodyIncludes: ['insufficient scope'] }
