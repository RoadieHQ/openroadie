      oneOf:
        - type: object
          description: HTTP request
          required: [backendType, path]
          properties:
            backendType:
              type: string
              const: http
            path:
              type: string
              minLength: 1
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
              default: GET
            headers:
              type: object
              additionalProperties:
                type: string
            body: {}
        - type: object
          description: AWS CloudControl resource request
          required: [backendType, mode, resourceType, accountId, region]
          properties:
            backendType:
              type: string
              const: aws
            mode:
              type: string
              const: cloud-control
            resourceType:
              type: string
              minLength: 1
            accountId:
              type: string
              minLength: 1
            region:
              type: string
              minLength: 1
            operation:
              type: string
              enum: [get, delete, update, create]
            identifier:
              type: string
            desiredState:
              type: string
            patchDocument:
              type: string
        - type: object
          description: AWS signed API request
          required: [backendType, mode, service, profile, region, path]
          properties:
            backendType:
              type: string
              const: aws
            mode:
              type: string
              const: service-api
            service:
