              minLength: 1
            profile:
              type: string
              minLength: 1
            operation:
              type: string
            region:
              type: string
              minLength: 1
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
              default: POST
            path:
              type: string
              minLength: 1
            headers:
              type: object
              additionalProperties:
                type: string
            body:
              type: string

