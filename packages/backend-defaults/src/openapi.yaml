          in: query
          description: Comma-separated datasource UUIDs
          schema:
            type: string
      responses:
        '200':
          description: Relationship types
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '400':
