        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Rule page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContextGroupRule' }
                  total: { type: integer }
    post:
      operationId: createContextGroupRule
      tags: [catalog-datastore-context-groups]
      summary: Create a context group rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextGroupRuleInput' }
      responses:
        '201':
          description: Created rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextGroupRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
