    get:
      operationId: getIndexConfiguration
      tags: [catalog-datastore-indexes]
      summary: Get an index configuration by key
      responses:
        '200':
          description: Index configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexConfiguration'
