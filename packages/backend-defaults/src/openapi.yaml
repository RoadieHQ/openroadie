        '409':
          description: Rule not in expected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-datastore/relationship-rules/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: dismissRelationshipRule
      tags: [catalog-datastore-relationship-rules]
      summary: Dismiss a suggested rule (suggested -> inactive)
