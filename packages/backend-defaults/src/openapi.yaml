  /catalog-datastore/context-groups/rules/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getContextGroupRule
      tags: [catalog-datastore-context-groups]
      summary: Get a context group rule
      responses:
        '200':
          description: Rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextGroupRule' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceContextGroupRule
      tags: [catalog-datastore-context-groups]
      summary: Replace a context group rule
      description: Full replacement. Omitted optional fields are cleared to defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextGroupRuleInput' }
      responses:
        '200':
          description: Replaced rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextGroupRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateContextGroupRule
      tags: [catalog-datastore-context-groups]
      summary: Update some fields of a context group rule
      description: Writes only the keys the body carries. The merging verb.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextGroupRuleInput' }
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextGroupRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
