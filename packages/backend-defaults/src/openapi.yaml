  # ==========================================================================
  # ACTIONS
  # ==========================================================================
  /actions:
    get:
      operationId: listActions
      tags: [actions]
      summary: List actions
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Action page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Action' }
                  total: { type: integer }
    post:
      operationId: createAction
      tags: [actions]
      summary: Create an action
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionInput' }
      responses:
        '201':
          description: Created action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Slug already in use

  /actions/execute:
    post:
      operationId: executeActionDraft
      tags: [actions]
      summary: Execute an unsaved action draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                parameters: { type: array, items: { type: object } }
                steps: { type: array, items: { type: object } }
                inputs: { type: object }
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }

  /actions/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: getAction
      tags: [actions]
      summary: Get an action
      responses:
        '200':
          description: Action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceAction
      tags: [actions]
      summary: Write an action
      description: >
        Writes only the keys the body carries. PUT becomes a full replacement
        once no caller sends a partial body (SC-34599).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionInput' }
      responses:
        '200':
          description: Updated action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateAction
      tags: [actions]
      summary: Update some fields of an action
      description: Writes only the keys the body carries. The merging verb.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionInput' }
      responses:
        '200':
          description: Updated action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteAction
      tags: [actions]
      summary: Delete an action
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /actions/{id}/execute:
    parameters:
      - name: id
        in: path
        required: true
        description: Action id or slug — both resolve here.
        schema: { type: string }
    post:
      operationId: executeAction
      tags: [actions]
      summary: Execute a saved action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                inputs: { type: object }
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }

  /actions/{id}/versions:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      operationId: listActionVersions
      tags: [actions]
      summary: List an action's versions
      responses:
        '200':
          description: Version page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }

  /actions/{id}/versions/{version}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getActionVersion
      tags: [actions]
      summary: Get one version of an action
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }

  /actions/{id}/versions/{version}/restore:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      operationId: restoreActionVersion
      tags: [actions]
      summary: Restore an action to an earlier version
      responses:
        '200':
          description: Restored action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Action' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # CATALOG DATASTORE - Context groups
  # ==========================================================================
  /catalog-datastore/context-groups/rules:
    get:
