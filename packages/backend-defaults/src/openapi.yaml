      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationRequest'
      responses:
        '200':
          description: Proxied response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {}
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==========================================================================
  # INTEGRATION SCHEMAS
  # ==========================================================================
  /integrations/integration-schemas:
    get:
      operationId: listIntegrationSchemas
      tags: [integration-schemas]
      summary: List integration schemas (or get a single schema by integrationId + path)
      parameters:
        - name: integrationId
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
        - name: sourceType
          in: query
          schema:
            type: string
            enum: [spec, inferred]
        - name: pathSearch
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Schema list or single schema
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Paginated list
                    required: [data, total, offset, limit]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/IntegrationSchema'
                      total:
                        type: integer
                      offset:
                        type: integer
                      limit:
                        type: integer
                  - type: object
                    description: Single schema (when integrationId + path provided)
                    properties:
                      data:
                        $ref: '#/components/schemas/IntegrationSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createIntegrationSchema
      tags: [integration-schemas]
      summary: Create an integration schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationSchemaInput'
      responses:
        '201':
          description: Created schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IntegrationSchema'
        '400':
          $ref: '#/components/responses/BadRequest'

  /integrations/integration-schemas/paths:
    get:
      operationId: listIntegrationSchemaPaths
      tags: [integration-schemas]
      summary: List path suggestions for an integration
      parameters:
        - name: integrationId
          in: query
          required: true
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Path suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /integrations/integration-schemas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIntegrationSchema
      tags: [integration-schemas]
      summary: Get a schema by ID
      responses:
        '200':
          description: Schema detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IntegrationSchema'
        '404':
