            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ==========================================================================
  # CATALOG-DATASTORE — Objects
  # ==========================================================================
  /catalog-datastore/objects:
    get:
      operationId: listAllDatastoreObjects
      tags: [catalog-datastore]
      summary: List all objects across all datasources
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: graph
          in: query
          description: When true, return lightweight graph data instead of full objects
          schema:
            type: string
            enum: ['true', 'false']
        - name: datasourceIds
          in: query
          description: Comma-separated datasource UUIDs used when graph=true
          schema:
            type: string
        - name: unlimited
          in: query
          description: >
            When true, bypass the default 5,000-row cap per collection in graph
            mode. Use sparingly — large instances may return very large payloads.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Paginated object list or lightweight object graph
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DatastoreQueryResult'
                  - $ref: '#/components/schemas/ObjectGraphResult'

  /catalog-datastore/objects/join:
    post:
      operationId: queryWithJoin
      tags: [catalog-datastore]
      summary: Query objects with a join across two datasources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  leftDatasourceId,
                  rightDatasourceId,
                  leftIndexKey,
                  rightIndexKey,
                  rightAlias,
                ]
              properties:
                leftDatasourceId:
                  type: string
                  format: uuid
                rightDatasourceId:
                  type: string
                  format: uuid
                leftIndexKey:
                  type: string
                rightIndexKey:
                  type: string
                rightAlias:
                  type: string
                limit:
                  type: integer
                offset:
                  type: integer
      responses:
        '200':
          description: Joined results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-datastore/objects/graph/rooted:
    get:
      operationId: getRootedObjectGraph
      tags: [catalog-datastore]
      summary: Bounded neighborhood graph around one object
      description: >
        Walks the relationship graph outward from a root object to a depth,
        under optional datasource/type/origin/direction filters, and returns
        the reached nodes (with per-node depth and hidden-neighbor counts),
        the induced edges among them, and a truncation flag.
      parameters:
        - name: rootDatasourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: rootObjectId
          in: query
          required: true
          schema:
            type: string
        - name: depth
          in: query
          description: Hops from the root, 1-3 (default 2)
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [out, in, both]
        - name: datasourceIds
          in: query
          description: Comma-separated datasource UUIDs the walk may enter
          schema:
            type: string
        - name: relationshipTypes
          in: query
          description: >
            Comma-separated type names; an edge matches on its type or its
            reciprocal type
          schema:
            type: string
        - name: origin
          in: query
          description: rule = rule-materialized edges, direct = manually asserted
          schema:
            type: string
            enum: [rule, direct]
        - name: nodeLimit
          in: query
          description: Node cap, 1-500 (default 500)
          schema:
            type: integer
      responses:
        '200':
          description: The rooted subgraph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootedObjectGraphResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog-datastore/objects/graph/paths:
    get:
      operationId: getObjectGraphPaths
      tags: [catalog-datastore]
      summary: All simple paths between two objects
      description: >
        Finds every simple path between two objects up to maxDepth hops,
        shortest first and capped at pathLimit, and returns the merged
        subgraph plus each path's node/edge sequence.
      parameters:
        - name: sourceDatasourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: sourceObjectId
          in: query
          required: true
          schema:
            type: string
        - name: targetDatasourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: targetObjectId
          in: query
          required: true
          schema:
            type: string
        - name: maxDepth
          in: query
          description: Maximum hops, 1-6 (default 4)
          schema:
            type: integer
        - name: direction
          in: query
          schema:
            type: string
            enum: [out, in, both]
        - name: datasourceIds
          in: query
          description: Comma-separated datasource UUIDs the paths may enter
          schema:
            type: string
        - name: relationshipTypes
          in: query
          description: >
            Comma-separated type names; an edge matches on its type or its
            reciprocal type
          schema:
            type: string
        - name: origin
          in: query
          schema:
            type: string
            enum: [rule, direct]
        - name: pathLimit
          in: query
          description: Path cap, 1-50 (default 50)
          schema:
            type: integer
      responses:
        '200':
          description: The merged path subgraph and per-path sequences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectGraphPathsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog-datastore/objects/{datasourceId}:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    get:
      operationId: listObjectsByDatasource
      tags: [catalog-datastore]
      summary: List objects for a datasource
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
        - name: sortByIndex
          in: query
          schema:
            type: string
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: filter
          in: query
          schema:
            type: object
            additionalProperties:
              type: string
        - name: explain
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatastoreQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: addDatastoreObject
      tags: [catalog-datastore]
      summary: Add a single object to a datasource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, objectId, object]
              properties:
                id:
                  type: string
                  format: uuid
                objectId:
                  type: string
                object: {}
                createdAt:
                  type: string
                  format: date-time
                updatedAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Object added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      operationId: replaceAllDatasourceObjects
      tags: [catalog-datastore]
      summary: Replace all objects in a datasource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Replacement result
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: deleteAllDatasourceObjects
      tags: [catalog-datastore]
      summary: Delete all objects in a datasource
      responses:
        '204':
          description: Deleted

  /catalog-datastore/objects/{datasourceId}/{objectId}:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
      - name: objectId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getDatastoreObject
      tags: [catalog-datastore]
      summary: Get a single object with its relationships
      responses:
        '200':
          description: Object with relationships
          content:
            application/json:
              schema:
