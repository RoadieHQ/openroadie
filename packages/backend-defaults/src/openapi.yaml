          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteAllIndexConfigurations
      tags: [catalog-datastore-indexes]
      summary: Delete all index configurations for a datasource
      responses:
        '204':
