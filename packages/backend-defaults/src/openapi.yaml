        '404': { $ref: '#/components/responses/NotFound' }

  /catalog-datastore/context-groups/rules/{id}/groups:
    parameters:
      - name: id
        in: path
        required: true
        description: Rule id or slug.
        schema: { type: string }
    get:
      operationId: listGroupsForContextGroupRule
      tags: [catalog-datastore-context-groups]
      summary: List the groups one rule produced
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { type: object } }
                  totalGroups: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog-datastore/context-groups/groups:
    get:
      operationId: listContextGroups
      tags: [catalog-datastore-context-groups]
      summary: List materialized context groups
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Group page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }

  /catalog-datastore/context-groups/preview:
    post:
      operationId: previewContextGroupRule
      tags: [catalog-datastore-context-groups]
      summary: Preview the groups a rule definition would produce
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContextGroupRuleInput' }
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { type: object } }
                  totalGroups: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ==========================================================================
  # WORKSPACES
  # ==========================================================================
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List the workspaces the caller may see
      description: >
        Organization workspaces, plus the caller's own personal ones. Another
        user's personal workspace is never returned.
      responses:
        '200':
          description: Visible workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspaces:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a workspace
      description: >
        Requires `workspace:create:personal` for a personal workspace and the
        un-narrowed `workspace:create` for an organization one. The owner of a
        personal workspace is the caller; it is never read from the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '201':
          description: Created workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: Scope does not cover creating this type of workspace
        '409':
          description: Slug already in use

  /workspaces/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get a workspace
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Update a workspace's name or mark
      description: >
        Slug and type are fixed at creation — a body carrying either is
        rejected. A slug is an address, and changing a type would orphan or
        capture ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdate' }
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Delete a workspace
      description: >
        Removes the workspace row only — nothing cascades. Data that belonged
        to it stops being reachable rather than being destroyed.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The default workspace cannot be deleted

  /workspaces/teams:
    get:
      operationId: listTeams
      tags: [workspaces]
      summary: List team workspaces
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items: { $ref: '#/components/schemas/Team' }
    post:
      operationId: createTeam
      tags: [workspaces]
      summary: Create a team workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Created team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Team creation is unavailable }
        '409': { description: Slug already in use }

  /workspaces/teams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateTeam
      tags: [workspaces]
      summary: Rename a team workspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamUpdate' }
      responses:
        '200':
          description: Updated team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTeam
      tags: [workspaces]
      summary: Delete a team workspace
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /workspaces/teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listTeamMembers
      tags: [workspaces]
      summary: List team members
      responses:
        '200':
          description: Team members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addTeamMember
      tags: [workspaces]
      summary: Add a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201':
          description: Added member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: User is already a member }

  /workspaces/teams/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeTeamMember
      tags: [workspaces]
      summary: Remove a team member
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

# ---------------------------------------------------------------------------
# COMPONENTS
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    ServiceToken:
      type: http
      scheme: bearer
      description: >
        A Roadie service token (`rst_…`) or a user JWT. Both are exchanged by the
        same middleware, so the wire contract is identical.


        Per-route scope requirements are deliberately not duplicated here. They
        live in `packages/e2e/tests/scopes/*.yaml`, which the scope-enforcement
        suite asserts covers every entry in `SCOPES` — that set is the
        machine-readable source, and a copy in this document would drift from it.


        One trap worth stating: a token carrying **no** `scopes` claim is granted
        every scope. A present array — including an empty one — restricts to
        exactly those. Scope a machine token explicitly, or it is a root
        credential.
  parameters:
    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ExecutionId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IntegrationId:
      name: id
      in: path
      required: true
      description: Integration ID or slug
      schema:
        type: string
    DatasourceId:
      name: datasourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- Common ---
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: object
              properties:
                message:
                  type: string
                name:
                  type: string
            - type: string

    # --- Workflow Types ---
    WorkflowType:
      type: string
      enum: [data-ingestion]

    ExecutionStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]

    TriggerType:
      type: string
      enum: [scheduled, manual, webhook, event]

    NodeExecutionStatus:
      type: string
      enum: [pending, running, completed, failed, skipped]

    WorkflowViewport:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        zoom:
          type: number

    WorkflowNodeData:
      type: object
      required: [label, config]
      properties:
        label:
          type: string
        config:
          type: object
          additionalProperties: true
        description:
          type: string

    WorkflowNode:
      type: object
      required: [id, type, position, data]
      properties:
        id:
          type: string
        type:
          type: string
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
        data:
          $ref: '#/components/schemas/WorkflowNodeData'
        width:
          type: number
        height:
          type: number
        selected:
          type: boolean
        dragging:
          type: boolean

    EdgeTransform:
      type: object
      properties:
        type:
          type: string
          enum: [jsonata]
        expression:
          type: string

    WorkflowEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        sourceHandle:
          type: string
        targetHandle:
          type: string
        transform:
          $ref: '#/components/schemas/EdgeTransform'
        animated:
          type: boolean
        style:
          type: object
          additionalProperties: true

    WorkflowDefinition:
      type: object
      required:
        [
          id,
          name,
          slug,
          version,
          workflowType,
          nodes,
          edges,
          enabled,
          createdBy,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        version:
          type: integer
        workflowType:
          $ref: '#/components/schemas/WorkflowType'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        viewport:
          $ref: '#/components/schemas/WorkflowViewport'
        enabled:
          type: boolean
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateWorkflowInput:
      type: object
      required: [workflowType]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Derived from the name when omitted.
        description:
          type: string
        workflowType:
          $ref: '#/components/schemas/WorkflowType'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        viewport:
          $ref: '#/components/schemas/WorkflowViewport'
        enabled:
          type: boolean

    UpdateWorkflowInput:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        workflowType:
          $ref: '#/components/schemas/WorkflowType'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        viewport:
