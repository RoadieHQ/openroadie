      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/IntegrationType'
        host:
          type: string
        authType:
          $ref: '#/components/schemas/IntegrationAuthType'
        authConfig:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        backendType:
          $ref: '#/components/schemas/IntegrationBackendType'
        requestsPerHour:
          type: number
        requestsPerSecond:
          type: number
        burstCapacity:
          type: number
        config:
          type: object
          additionalProperties: true
        logoSlug:
          type: string
          nullable: true

