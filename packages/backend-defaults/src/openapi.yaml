        in: path
        required: true
        description: >
          Capability id. GET also accepts the slug, so an `@capability:<slug>`
          reference resolves without a lookup; the write verbs are id-only.
        schema: { type: string }
    get:
      operationId: getCapability
      tags: [capabilities]
      summary: Get a capability by id or slug
      responses:
        '200':
          description: Capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capability' }
