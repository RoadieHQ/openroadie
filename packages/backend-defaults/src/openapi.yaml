    put:
      operationId: updateIntegrationSchema
      tags: [integration-schemas]
      summary: Update a schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationSchemaInput'
      responses:
        '200':
          description: Updated schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/IntegrationSchema'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      operationId: deleteIntegrationSchema
      tags: [integration-schemas]
