    get:
      operationId: listRelationshipTypes
      tags: [catalog-datastore-relationships]
      summary: List distinct relationship types for a datasource
      responses:
        '200':
          description: Relationship types
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-datastore/relationships/source/{datasourceId}/{objectId}:
