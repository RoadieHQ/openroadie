            properties:
              id:
                type: string
              datasourceId:
                type: string
              objectId:
                type: string
              object: {}
        total:
          type: integer
        explain:
          type: object

    # --- Secrets Types ---
    Secret:
      type: object
      properties:
        name:
          type: string
        internalKeyName:
          type: string
        description:
          type: string
        value:
          type: string
        status:
          type: string
        helpUrl:
          type: string

    SecretMetadata:
      type: object
      required: [name]
      properties:
        name:
          type: string
        internalKeyName:
          type: string
        description:
          type: string
        helpUrl:
          type: string

    # --- Capability Types ---

    Workspace:
      type: object
      required: [id, name, slug, type, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: Lowercase alphanumerics joined by single hyphens. Immutable.
        type: { type: string, enum: [organization, team, personal] }
        svg:
          type: string
          nullable: true
          description: >
            Square mark as SVG markup, rendered through a data: URL in an
            `<img>`. Null falls back to the product mark.
        ownerUserId:
          type: string
          nullable: true
          description: >
            User id of the owner. Set for personal workspaces only; opaque and
            provider-shaped, so display it rather than parsing it.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    WorkspaceInput:
      type: object
      required: [name, slug, type]
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: string }
        type: { type: string, enum: [organization, personal] }
        svg: { type: string, nullable: true }

    WorkspaceUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        svg: { type: string, nullable: true }

    Team:
      type: object
      required: [id, name, slug, memberCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        memberCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TeamInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: string }

    TeamUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }

    TeamMember:
      type: object
      required: [userId, email, createdAt]
      properties:
        userId: { type: string }
        email: { type: string, format: email, nullable: true }
        createdAt: { type: string, format: date-time }

    Capability:
      type: object
      required: [id, name, slug, description, instructions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        instructions: { type: string }
        currentVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CapabilityInput:
      type: object
      required: [name, description, instructions]
      properties:
        name: { type: string }
        slug:
          type: string
          description: Derived from the name when omitted; kept as-is on update.
        description: { type: string }
        instructions: { type: string }

    # --- Action Types ---

    ActionParamType:
      type: string
      enum: [string, number, integer, boolean, 'array<string>']

    ActionHeader:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }

    HttpActionRequest:
      type: object
      required: [method, path, headers, body]
      properties:
        backendType:
          type: string
          enum: [http]
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path: { type: string }
        headers:
          type: array
          items: { $ref: '#/components/schemas/ActionHeader' }
        body: { type: string }

    AwsServiceActionRequest:
      type: object
      required:
        [
          backendType,
          mode,
          service,
          profile,
          region,
          method,
          path,
          headers,
          body,
        ]
      properties:
        backendType:
          type: string
          enum: [aws]
        mode:
          type: string
          enum: [service-api]
        service: { type: string, minLength: 1 }
        operation: { type: string }
        profile: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path: { type: string }
        headers:
          type: array
          items: { $ref: '#/components/schemas/ActionHeader' }
        body: { type: string }

    ActionRequest:
      oneOf:
        - $ref: '#/components/schemas/AwsServiceActionRequest'
        - $ref: '#/components/schemas/HttpActionRequest'

    ActionParam:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        type: { $ref: '#/components/schemas/ActionParamType' }
        description: { type: string }
        required: { type: boolean }
        default: {}

    ActionStep:
      type: object
      required: [id, integrationId, request]
      properties:
        id:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
        integrationId: { type: string, minLength: 1 }
        request: { $ref: '#/components/schemas/ActionRequest' }

    Action:
      type: object
      required: [id, name, slug, steps, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ActionParam' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ActionStep' }
        enabled: { type: boolean }
        mode:
          type: string
          readOnly: true
          description: >
            Derived server-side from the steps (read iff every step is a GET).
        inputSchema:
          type: object
          readOnly: true
          description: Compiled JSON Schema for the action's parameters.
        currentVersion: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ActionInput:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        slug:
          type: string
          description: Derived from the name when omitted; kept as-is on update.
        description: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ActionParam' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/ActionStep' }
        enabled: { type: boolean }

    # --- Context Group Types ---

    Annotation:
      type: object
      required: [title, text]
      properties:
        title: { type: string }
        text: { type: string }

    FieldMapping:
      type: object
      required: [source, label]
      properties:
        source:
          type: string
          description: Dot-notation path into the object JSON.
        label:
          type: string
          description: Key emitted in the projected bundle output.

    IncludeProjection:
      type: object
      required: [mode, fields]
      properties:
        mode:
          type: string
          enum: [include]
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldMapping' }

    ExcludeProjection:
      type: object
      required: [mode, paths]
      properties:
        mode:
          type: string
          enum: [exclude]
        paths:
          type: array
          items: { type: string }
          description: Dot-notation paths to remove from the object.

    ContextGroupDatasourceStatus:
      type: object
      readOnly: true
      required: [live]
      properties:
        live: { type: boolean }
        datasourceId: { type: string }
        seedName: { type: string }
        displayName: { type: string }
        inactiveReason: { type: string }

    DatasourceFilter:
      type: object
      properties:
        datasourceId: { type: string }
        seedName: { type: string }
        filter:
          type: string
          description: Serialized FilterCondition[]; objects must match every condition.
        status:
          $ref: '#/components/schemas/ContextGroupDatasourceStatus'
        projection:
          oneOf:
            - $ref: '#/components/schemas/IncludeProjection'
            - $ref: '#/components/schemas/ExcludeProjection'
            - type: array
              items: { $ref: '#/components/schemas/FieldMapping' }
              description: Legacy include-only form (bare array of mappings).
        annotation: { $ref: '#/components/schemas/Annotation' }

    ContextGroupRule:
      type: object
      required: [id, name, slug, datasources]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        datasources:
          type: array
          items: { $ref: '#/components/schemas/DatasourceFilter' }
        mergeRelationshipTypes: { type: array, items: { type: string } }
        annotations:
          type: array
          items: { $ref: '#/components/schemas/Annotation' }
        includeExternalRelations: { type: boolean }
        seedVersion: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ContextGroupRuleInput:
      type: object
      required: [name, datasources]
      properties:
        name: { type: string }
        slug:
          type: string
          description: Derived from the name when omitted; kept as-is on update.
        description: { type: string, nullable: true }
        datasources:
          type: array
          items: { $ref: '#/components/schemas/DatasourceFilter' }
        mergeRelationshipTypes: { type: array, items: { type: string } }
        annotations:
          type: array
          items: { $ref: '#/components/schemas/Annotation' }
        includeExternalRelations: { type: boolean }
        seedVersion: { type: integer, nullable: true }
