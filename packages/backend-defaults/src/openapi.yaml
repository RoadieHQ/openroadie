        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: replaceCapability
      tags: [capabilities]
      summary: Write a capability
      description: >
        Writes only the keys the body carries. PUT becomes a full replacement
        once no caller sends a partial body (SC-34599) — see
        docs/put-patch-contract-migration.md.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityInput' }
      responses:
        '200':
          description: Updated capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateCapability
      tags: [capabilities]
      summary: Update some fields of a capability
      description: Writes only the keys the body carries. The merging verb.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CapabilityInput' }
      responses:
        '200':
          description: Updated capability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteCapability
      tags: [capabilities]
      summary: Delete a capability
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

