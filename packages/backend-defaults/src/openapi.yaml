openapi: 3.1.0
info:
  title: Roadie Backend API
  version: 1.0.0
  description: >
    Comprehensive API specification for the Roadie backend,
    covering catalog workflows, executions, integrations, datastore,
    secrets, feature flags, permissions, and AI.

servers:
  - url: /api
    description: Backend API base path

security:
  - ServiceToken: []

tags:
  - name: catalog-workflow
    description: Workflow management — CRUD, execution, dry-run, scheduling
  - name: catalog-workflow-executions
    description: Execution management — list, stream, cancel, retry, logs
  - name: catalog-workflow-nodes
    description: Node type registry
  - name: catalog-workflow-graph-layouts
    description: Persisted graph layout positions
  - name: catalog-workflow-jsonata-assist
    description: AI-assisted JSONata expression generation
  - name: integrations
    description: Integration management — CRUD, proxied requests, logos
  - name: integration-schemas
    description: Integration response-schema management
  - name: catalog-datastore
    description: Datastore object CRUD and querying
  - name: catalog-datastore-schemas
    description: Datastore schema versions and relationship suggestions
  - name: catalog-datastore-indexes
    description: Index configuration management
  - name: catalog-datastore-relationships
    description: Object relationship CRUD
  - name: catalog-datastore-relationship-rules
    description: Relationship rule management and lifecycle
  - name: catalog-datastore-search
    description: Full-text search across datastore objects
  - name: secrets-settings
    description: Secret key management and metadata
  - name: permission
    description: Role, policy, and user-role management
  - name: ai
    description: AI agent invocation and usage metering
  - name: workspaces
    description: Tenant workspaces — the boundary catalog data belongs to

# ---------------------------------------------------------------------------
# PATHS
# ---------------------------------------------------------------------------
paths:
  # ==========================================================================
  # CATALOG-WORKFLOW — Workflows
  # ==========================================================================
  /catalog-workflow/workflows:
    get:
      operationId: listWorkflows
      tags: [catalog-workflow]
      summary: List workflows
      parameters:
        - name: enabled
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: workflowType
          in: query
          schema:
            $ref: '#/components/schemas/WorkflowType'
      responses:
        '200':
          description: Paginated workflow list
          content:
            application/json:
              schema:
                type: object
                required: [data, total, offset, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowDefinition'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createWorkflow
      tags: [catalog-workflow]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowInput'
      responses:
        '201':
          description: Created workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/workflows/dry-run:
    post:
      operationId: dryRunWorkflow
      tags: [catalog-workflow]
      summary: Execute a workflow dry-run without persisting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodes, edges]
              properties:
                name:
                  type: string
                workflowType:
                  $ref: '#/components/schemas/WorkflowType'
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowNode'
                edges:
                  type: array
                  items:
                    $ref: '#/components/schemas/WorkflowEdge'
                inputs: {}
                previewLimit:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/workflows/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getWorkflow
      tags: [catalog-workflow]
      summary: Get a workflow by ID
      responses:
        '200':
          description: Workflow detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateWorkflow
      tags: [catalog-workflow]
      summary: Update a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowInput'
      responses:
        '200':
          description: Updated workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowDefinition'
    patch:
      operationId: updateWorkflowPartial
      tags: [catalog-workflow]
      summary: Update some fields of a workflow
      description: Writes only the keys the body carries. The merging verb.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkflowInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteWorkflow
      tags: [catalog-workflow]
      summary: Delete a workflow
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /catalog-workflow/workflows/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getWorkflowSchedule
      tags: [catalog-workflow]
      summary: Get schedule info for a workflow
      responses:
        '200':
          description: Schedule info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object

  /catalog-workflow/workflows/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      operationId: duplicateWorkflow
      tags: [catalog-workflow]
      summary: Duplicate a workflow
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Duplicated workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowDefinition'

  /catalog-workflow/workflows/{id}/execute:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    post:
      operationId: executeWorkflow
      tags: [catalog-workflow]
      summary: Request an immediate run of a workflow
      responses:
        '200':
          description: The started or already in-flight execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '503':
          description: Run was requested but no dispatcher started it in time

  /catalog-workflow/workflows/{id}/executions/latest:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: getLatestWorkflowExecution
      tags: [catalog-workflow]
      summary: Get the latest execution for a workflow
      responses:
        '200':
          description: Latest execution
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowExecution'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog-workflow/workflows/{id}/executions:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
    get:
      operationId: listWorkflowExecutions
      tags: [catalog-workflow]
      summary: List executions for a specific workflow
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ExecutionStatus'
        - name: triggerType
          in: query
          schema:
            $ref: '#/components/schemas/TriggerType'
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated execution list
          content:
            application/json:
              schema:
                type: object
                required: [data, total, offset, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowExecution'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==========================================================================
  # CATALOG-WORKFLOW — Executions (top-level)
  # ==========================================================================
  /catalog-workflow/executions:
    get:
      operationId: listExecutions
      tags: [catalog-workflow-executions]
      summary: List all executions (cross-workflow)
      parameters:
        - name: workflowId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: triggerType
          in: query
          schema:
            type: string
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - name: createdBefore
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Paginated execution list
          content:
            application/json:
              schema:
                type: object
                required: [data, total, offset, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowExecution'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/executions/latest-summaries:
    post:
      operationId: getLatestExecutionSummaries
      tags: [catalog-workflow-executions]
      summary: Get latest execution summaries for a batch of workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflowIds]
              properties:
                workflowIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Summaries keyed by workflow ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LatestExecutionSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/executions/{id}:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getExecution
      tags: [catalog-workflow-executions]
      summary: Get an execution by ID
      responses:
        '200':
          description: Execution detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/WorkflowExecution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog-workflow/executions/{id}/stream:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: streamExecution
      tags: [catalog-workflow-executions]
      summary: Stream execution events via SSE
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog-workflow/executions/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: cancelExecution
      tags: [catalog-workflow-executions]
      summary: Cancel a running execution
      responses:
        '200':
          description: Cancellation confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/executions/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    post:
      operationId: retryExecution
      tags: [catalog-workflow-executions]
      summary: Retry a failed execution
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                inputs: {}
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/executions/{id}/request-logs:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getExecutionRequestLogs
      tags: [catalog-workflow-executions]
      summary: Get HTTP request logs for an execution
      responses:
        '200':
          description: Request logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowRequestLog'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/executions/{id}/logs:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getExecutionLogs
      tags: [catalog-workflow-executions]
      summary: Get execution logs
      parameters:
        - name: nodeId
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
        - name: after
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Paginated log list
          content:
            application/json:
              schema:
                type: object
                required: [data, total, offset, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExecutionLog'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-workflow/executions/{id}/node-executions:
    parameters:
      - $ref: '#/components/parameters/ExecutionId'
    get:
      operationId: getNodeExecutions
      tags: [catalog-workflow-executions]
      summary: Get per-node execution details
      responses:
        '200':
          description: Node executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeExecution'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==========================================================================
  # CATALOG-WORKFLOW — Nodes
  # ==========================================================================
  /catalog-workflow/nodes:
    get:
      operationId: listNodeTypes
      tags: [catalog-workflow-nodes]
      summary: List available node type definitions
      parameters:
        - name: workflowType
          in: query
          schema:
            $ref: '#/components/schemas/WorkflowType'
      responses:
        '200':
          description: Node definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeTypeDefinition'

  /catalog-workflow/nodes/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getNodeType
      tags: [catalog-workflow-nodes]
      summary: Get a single node type definition
      responses:
        '200':
          description: Node definition
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/NodeTypeDefinition'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # CATALOG-WORKFLOW — Graph Layouts
  # ==========================================================================
  /catalog-workflow/graph-layouts:
    get:
      operationId: listGraphLayouts
      tags: [catalog-workflow-graph-layouts]
      summary: List all saved graph layouts
      responses:
        '200':
          description: Layout list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GraphLayout'

  /catalog-workflow/graph-layouts/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getGraphLayout
      tags: [catalog-workflow-graph-layouts]
      summary: Get a graph layout by name
      responses:
        '200':
          description: Layout detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GraphLayout'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: upsertGraphLayout
      tags: [catalog-workflow-graph-layouts]
      summary: Create or update a graph layout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodes:
                  type: array
                  items:
                    $ref: '#/components/schemas/GraphLayoutNode'
                edges:
                  type: array
                  items:
                    $ref: '#/components/schemas/GraphLayoutEdge'
                viewport:
                  $ref: '#/components/schemas/WorkflowViewport'
      responses:
        '200':
          description: Upserted layout
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/GraphLayout'
    delete:
      operationId: deleteGraphLayout
      tags: [catalog-workflow-graph-layouts]
      summary: Delete a graph layout
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # CATALOG-WORKFLOW — JSONata Assist
  # ==========================================================================
  /catalog-workflow/jsonata-assist:
    post:
      operationId: generateJsonataExpression
      tags: [catalog-workflow-jsonata-assist]
      summary: Generate a JSONata expression via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonataAssistRequest'
      responses:
        '200':
          description: Generated expression
          content:
            application/json:
              schema:
                type: object
                properties:
                  expression:
                    type: string
                  explanation:
                    type: string

  /catalog-workflow/jsonata-assist/stream:
    post:
      operationId: streamJsonataExpression
      tags: [catalog-workflow-jsonata-assist]
      summary: Stream a JSONata expression generation via SSE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonataAssistRequest'
      responses:
        '200':
          description: SSE stream of generated expression
          content:
            text/event-stream:
              schema:
                type: string

  /catalog-workflow/jsonata-assist/validate:
    post:
      operationId: validateJsonataExpression
      tags: [catalog-workflow-jsonata-assist]
      summary: Validate a JSONata expression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expression]
              properties:
                expression:
                  type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  error:
                    type: string

  # ==========================================================================
  # INTEGRATIONS
  # ==========================================================================
  /integrations/logos:
    get:
      operationId: listIntegrationLogos
      tags: [integrations]
      summary: List available integration logos
      responses:
        '200':
          description: Logo list
          content:
            application/json:
              schema:
                type: object
                properties:
                  logos:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        name:
                          type: string

  /integrations/logos/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIntegrationLogo
      tags: [integrations]
      summary: Get a logo SVG by slug
      responses:
        '200':
          description: SVG image
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'

  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List integrations
      parameters:
        - name: enabled
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 0
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Paginated integration list
          content:
            application/json:
              schema:
                type: object
                required: [data, total, offset, limit]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Integration'
                  total:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      operationId: createIntegration
      tags: [integrations]
      summary: Create an integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationInput'
      responses:
        '201':
          description: Created integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/BadRequest'

  /integrations/{id}:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    get:
      operationId: getIntegration
      tags: [integrations]
      summary: Get an integration by ID or slug
      responses:
        '200':
          description: Integration detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateIntegration
      tags: [integrations]
      summary: Update an integration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIntegrationInput'
      responses:
        '200':
          description: Updated integration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/BadRequest'
    patch:
      operationId: updateIntegrationPartial
      tags: [integrations]
      summary: Update some fields of an integration
      description: Writes only the keys the body carries. The merging verb.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIntegrationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteIntegration
      tags: [integrations]
      summary: Delete an integration
      responses:
        '200':
          description: Deletion confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /integrations/{id}/logo:
    parameters:
      - $ref: '#/components/parameters/IntegrationId'
    get:
      operationId: getIntegrationLogoById
