            type: integer
            minimum: 1
            maximum: 50
        - name: sourceObjectId
          in: query
          description: Preview one exact source object for an integration-backed rule
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  sourceDatasourceId,
                  targetDatasourceId,
                  sourceFieldExpression,
                  relationshipType,
                ]
              properties:
                sourceDatasourceId:
                  type: string
                  format: uuid
                targetDatasourceId:
                  type: string
                  format: uuid
                sourceFieldExpression:
                  type: string
                targetFieldExpression:
                  type: string
                relationshipType:
                  type: string
                matchStrategy:
                  $ref: '#/components/schemas/RelationshipRuleMatchStrategy'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRulePreviewResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-datastore/relationship-rules/approve:
    post:
      operationId: approveRelationshipRules
      tags: [catalog-datastore-relationship-rules]
      summary: Approve suggested rules in bulk, dismissing their mirrors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: >-
            Per-rule outcome. A rule that could not be approved is reported in
            `failed` rather than failing the request. Every requested id appears
            in exactly one of `approved`, `dismissedAsInverse` and `failed`.
          content:
            application/json:
              schema:
                type: object
                required: [approved, dismissedAsInverse, failed]
                properties:
                  approved:
                    type: array
                    items:
                      type: string
                      format: uuid
                  dismissedAsInverse:
                    description: >-
                      Mirrored suggestions dismissed because their opposite
                      direction was approved. May include ids that were not
                      requested.
                    type: array
                    items:
                      type: string
                      format: uuid
                  failed:
                    description: >-
                      Requested ids only, so a caller can count failures against
                      its own request.
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id:
                          type: string
                          format: uuid
                        reason:
                          type: string
                  inverseDismissFailed:
                    description: >-
                      Mirrors that were not requested and could not be
                      suppressed. They stay suggested and need a manual dismiss,
                      but they are not failures of the caller's request.
                    type: array
                    items:
                      type: object
                      required: [id, reason]
                      properties:
                        id:
                          type: string
                          format: uuid
                        reason:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /catalog-datastore/relationship-rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRelationshipRule
      tags: [catalog-datastore-relationship-rules]
      summary: Get a relationship rule by ID
      responses:
        '200':
          description: Rule detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateRelationshipRule
      tags: [catalog-datastore-relationship-rules]
      summary: Update a relationship rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipRuleInput'
      responses:
        '200':
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateRelationshipRulePartial
      tags: [catalog-datastore-relationship-rules]
      summary: Update some fields of a relationship rule
      description: Writes only the keys the body carries. The merging verb.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RelationshipRuleInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteRelationshipRule
      tags: [catalog-datastore-relationship-rules]
      summary: Delete a relationship rule and its relationships
      responses:
        '204':
          description: Deleted

  /catalog-datastore/relationship-rules/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveRelationshipRule
      tags: [catalog-datastore-relationship-rules]
      summary: Approve a suggested rule (suggested -> active)
      responses:
        '200':
          description: Approved rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
