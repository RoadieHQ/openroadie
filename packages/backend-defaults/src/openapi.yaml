    get:
      operationId: listCapabilityVersions
      tags: [capabilities]
      summary: List a capability's versions
      responses:
        '200':
          description: Version page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  total: { type: integer }

  /capabilities/{id}/versions/{version}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - { name: version, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getCapabilityVersion
      tags: [capabilities]
      summary: Get one version of a capability
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }

  /capabilities/{id}/versions/{version}/restore:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post:
      operationId: restoreCapabilityVersion
