        '404':
          $ref: '#/components/responses/NotFound'

  /catalog-datastore/schemas/{datasourceId}/suggest-relationships:
    parameters:
      - $ref: '#/components/parameters/DatasourceId'
    post:
      operationId: suggestRelationshipsForDatasource
      tags: [catalog-datastore-schemas]
      summary: Suggest relationships for a single datasource
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
