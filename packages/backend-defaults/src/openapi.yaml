          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteDatastoreObject
      tags: [catalog-datastore]
      summary: Delete a single object
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'

