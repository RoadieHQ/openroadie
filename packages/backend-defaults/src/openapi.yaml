          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-datastore/relationship-rules/{id}/reset:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resetRelationshipRule
      tags: [catalog-datastore-relationship-rules]
      summary: Reset an inactive rule (inactive -> suggested)
      responses:
        '200':
          description: Reset rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Rule not in expected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /catalog-datastore/relationship-rules/{id}/state:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setRelationshipRuleState
      tags: [catalog-datastore-relationship-rules]
      summary: Set a rule's state, walking whatever transitions it needs
      description: >
        Declarative alternative to the approve/dismiss/disable/reset verbs, which
        are one-way and 409 from the wrong state. Idempotent: sending the state
        the rule is already in is a no-op 200. Moves with no direct edge
        (active -> suggested, inactive -> active) are walked as two transitions;
        if the second fails, the 409 body carries the state actually reached.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [suggested, active, inactive]
      responses:
        '200':
          description: The rule in its target state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipRule'
        '400':
          description: Invalid rule id or unknown state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            An equivalent active rule already exists, or a concurrent transition
            moved the rule mid-walk. `state` carries the state actually reached.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      state:
                        type: string
                        enum: [suggested, active, inactive]

