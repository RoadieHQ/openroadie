                headers:
                  type: object
                  additionalProperties:
                    type: string
            - type: object
              description: Basic auth
              properties:
                username:
                  type: string
                password:
                  type: string
            - type: object
              description: Bearer token
              properties:
                token:
                  type: string
            - type: object
              description: OAuth2 client credentials
              properties:
                clientId:
                  type: string
                clientSecret:
                  type: string
                tokenUrl:
                  type: string
                scope:
                  type: string
            - type: 'null'
        backendType:
          $ref: '#/components/schemas/IntegrationBackendType'
        requestsPerHour:
          type: number
        requestsPerSecond:
          type: number
        burstCapacity:
          type: number
        config:
          type: object
          additionalProperties: true
        logoSlug:
          type: string

